name: Build sheng-devauth DEB (ARM)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential dpkg-dev git

      - name: Clone source repository
        run: |
          git clone https://github.com/map220v/sheng_devauth.git source

      - name: Build binary
        run: |
          cd source
          make

      - name: Prepare DEB structure
        run: |
          mkdir -p sheng-devauth/usr/bin
          mkdir -p sheng-devauth/DEBIAN

          chmod 0755 source/xiaomi_devauth
          cp source/xiaomi_devauth sheng-devauth/usr/bin/

          printf '%s\n' \
          '#!/bin/sh' \
          'set -e' \
          '' \
          'if command -v systemctl >/dev/null 2>&1; then' \
          '  systemctl daemon-reload || true' \
          '  systemctl enable sheng-devauth.service || true' \
          '  systemctl start sheng-devauth.service || true' \
          'fi' \
          '' \
          'exit 0' \
          > sheng-devauth/DEBIAN/postinst

          chmod 0755 sheng-devauth/DEBIAN/postinst

          printf '%s\n' \
          '#!/bin/sh' \
          'set -e' \
          '' \
          'if command -v systemctl >/dev/null 2>&1; then' \
          '  systemctl stop sheng-devauth.service || true' \
          '  systemctl disable sheng-devauth.service || true' \
          'fi' \
          '' \
          'exit 0' \
          > sheng-devauth/DEBIAN/prerm

          chmod 0755 sheng-devauth/DEBIAN/prerm

      - name: Build DEB
        run: |
          dpkg-deb --build sheng-devauth
          ls -la sheng-devauth.deb

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: sheng_devauth
          name: "sheng_devauth"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DEB to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: sheng-devauth.deb
          asset_name: sheng-devauth.deb
          asset_content_type: application/x-debian-package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
